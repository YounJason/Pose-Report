<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pose Report</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>

    <div id="app">
        <div class="screen setup-screen" id="screen-1">
            <h2>시스템 초기 설정</h2>
            <div class="form-group"><label>거북목 기준 각도</label><input type="number" id="cfg-turtle" value="10.0" step="0.1"></div>
            <div class="form-group"><label>등 굽음 기준 각도</label><input type="number" id="cfg-torso" value="20.0" step="0.1"></div>
            <div class="form-group"><label>어깨 비대칭 기준 각도</label><input type="number" id="cfg-shoulder" value="5.0" step="0.1"></div>
            <div class="form-group"><label>골반 비대칭 기준 각도</label><input type="number" id="cfg-pelvis" value="4.0" step="0.1"></div>
            <div class="form-group"><label>목 기울어짐 기준 각도</label><input type="number" id="cfg-head" value="5.0" step="0.1"></div>
            <div class="form-group"><label>상체 불균형 기준 각도</label><input type="number" id="cfg-spine" value="8.0" step="0.1"></div>
            <div class="form-group"><label>카메라 장치 인덱스</label><input type="number" id="cfg-cam" value="0" step="1"></div>
            <button id="btn-save" class="save-btn">설정 완료</button>
        </div>

        <div class="screen" id="screen-2">
            <div class="animated-bg"></div>
            <h1>실시간 AI 자세 분석 시스템</h1>
            <button class="btn" id="btn-start">시작하기</button>
        </div>

        <div class="screen" id="screen-3">
            <div class="qr-container">
                <div id="qrcode-privacy" class="qr-target"></div>
                <p>QR코드를 스캔하여 개인정보 처리방침에 동의해주세요.</p>
            </div>
        </div>

        <div class="screen" id="screen-4">
            <div class="camera-layout">
                <div class="viewfinder-wrapper">
                    <img id="viewfinder" alt="Camera Feed">
                    <div class="timer-badge" id="timer">60</div>
                    <div class="status-overlay status-unknown" id="status-box">인식되지 않음</div>
                </div>
            </div>
        </div>

        <div class="screen" id="screen-5">
            <div class="loading-card">
                <div class="loading-spinner"></div>
                <h2>리포트를 생성하는 중입니다</h2>
                <p class="help-text"></p>
            </div>
        </div>

        <div class="screen" id="screen-6">
            <div class="report-container">
                <header class="report-header">
                    <h1>리포트를 생성했습니다!</h1>
                </header>

                <div class="report-grid">
                    <div class="report-card metrics-card">
                        <h2>세부 항목 측정 결과</h2>
                        <div class="metrics-list">
                            <div class="metric-item">
                                <div class="metric-label">
                                    <span>거북목 위험도</span>
                                    <span class="metric-value status-good" id="val-turtle">양호 (4.2°)</span>
                                </div>
                                <div class="progress-bar-bg">
                                    <div class="progress-bar-fill fill-good" id="bar-turtle"></div>
                                </div>
                            </div>

                            <div class="metric-item">
                                <div class="metric-label">
                                    <span>등 · 허리 안정도</span>
                                    <span class="metric-value status-good" id="val-torso">안정 (12.0°)</span>
                                </div>
                                <div class="progress-bar-bg">
                                    <div class="progress-bar-fill fill-good" id="bar-torso"></div>
                                </div>
                            </div>

                            <div class="metric-item">
                                <div class="metric-label">
                                    <span>어깨 균형</span>
                                    <span class="metric-value status-warning" id="val-shoulder">주의 (5.8°)</span>
                                </div>
                                <div class="progress-bar-bg">
                                    <div class="progress-bar-fill fill-warning" id="bar-shoulder"></div>
                                </div>
                            </div>

                            <div class="metric-item">
                                <div class="metric-label">
                                    <span>골반 균형</span>
                                    <span class="metric-value status-good" id="val-pelvis">정상 (2.1°)</span>
                                </div>
                                <div class="progress-bar-bg">
                                    <div class="progress-bar-fill fill-good" id="bar-pelvis"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="report-card score-card">
                        <h2>종합 자세 점수</h2>
                        <div class="score-circle-wrapper">
                            <svg class="score-ring" viewBox="0 0 120 120">
                                <circle class="ring-bg" cx="60" cy="60" r="50"></circle>
                                <circle class="ring-progress" id="score-ring-progress" cx="60" cy="60" r="50"></circle>
                            </svg>
                            <div class="score-text">
                                <span class="score-num" id="report-score">85</span>
                                <span class="score-total">/ 100</span>
                            </div>
                        </div>
                    </div>

                    <div class="report-card action-card">
                        <div id="qrcode-download" class="qr-target qr-target-download"></div>
                    </div>

                    <div class="report-card advice-card">
                        <h2>AI 피드백</h2>
                        <div class="advice-content" id="llm-advice"></div>
                        <br><p class="help-text">AI는 실수를 할 수 있습니다. 해당 내용은 전문 의료인의 조언을 대체하지 않습니다.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body>

</html>
