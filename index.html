<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pose Report</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>

    <div id="app">
        <div class="screen setup-screen" id="screen-1">
            <h2>시스템 초기 설정</h2>
            <div class="form-group"><label>거북목 기준 각도</label><input type="number" id="cfg-turtle" value="10.0" step="0.1"></div>
            <div class="form-group"><label>등 굽음 기준 각도</label><input type="number" id="cfg-torso" value="20.0" step="0.1"></div>
            <div class="form-group"><label>어깨 비대칭 기준 각도</label><input type="number" id="cfg-shoulder" value="5.0" step="0.1"></div>
            <div class="form-group"><label>골반 비대칭 기준 각도</label><input type="number" id="cfg-pelvis" value="4.0" step="0.1"></div>
            <div class="form-group"><label>목 기울어짐 기준 각도</label><input type="number" id="cfg-head" value="5.0" step="0.1"></div>
            <div class="form-group"><label>상체 불균형 기준 각도</label><input type="number" id="cfg-spine" value="8.0" step="0.1"></div>
            <div class="form-group"><label>카메라 장치 인덱스</label><input type="number" id="cfg-cam" value="0" step="1"></div>
            <button id="btn-save" class="save-btn">설정 완료</button>
        </div>

        <div class="screen" id="screen-2">
            <div class="animated-bg"></div>
            <h1>실시간 AI 자세 분석 시스템</h1>
            <button class="btn" id="btn-start">시작하기</button>
        </div>

        <div class="screen" id="screen-3">
            <div class="qr-container">
                <div id="qrcode-privacy" class="qr-target"></div>
                <p>QR코드를 스캔하여 개인정보 처리방침에 동의해주세요.</p>
            </div>
        </div>

        <div class="screen" id="screen-4">
            <div class="camera-layout">
                <div class="viewfinder-wrapper">
                    <img id="viewfinder" alt="Camera Feed">
                    <div class="timer-badge" id="timer">01:00</div>
                    <div class="status-overlay status-unknown" id="status-box">인식 대기 중</div>
                </div>
            </div>
        </div>

        <div class="screen" id="screen-5">
            <div class="loading-card">
                <div class="loading-spinner"></div>
                <h2>리포트를 생성하는 중입니다</h2>
            </div>
        </div>

        <div class="screen" id="screen-6">
            <div class="report-layout">
                <div class="report-card">
                    <div id="qrcode-download" class="qr-target qr-target-download"></div>
                    <p class="report-help-text">QR 코드를 스캔하시면 리포트 파일을 PDF로 받으실 수 있습니다.</p>
                </div>
                <p class="report-help-text"><br><br><br><br>또는</p>
                <div class="report-card">
                    <h2>리포트를 출력하시겠습니까?</h2>
                    <button class="btn print-btn">출력하기</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body>

</html>
